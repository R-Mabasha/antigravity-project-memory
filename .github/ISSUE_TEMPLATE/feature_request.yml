name: "💡 Feature Request"
description: Suggest an idea or enhancement for Antigravity Project Memory
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting an idea to make Antigravity Project Memory better!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives You've Considered
      description: Any alternative solutions or workarounds you've thought of.
